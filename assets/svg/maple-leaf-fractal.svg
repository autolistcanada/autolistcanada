<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="leaf-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;" />
      <stop offset="100%" style="stop-color:#ff0000;" />
    </linearGradient>
    <g id="fractal-arm">
        <path d="M 0 0 L -5 -10 L 0 -10 L 5 -20 L 10 -10 L 15 -10 L 10 0 Z" />
    </g>
  </defs>
  <g transform="translate(50 95)">
    <g transform="scale(1.5)">
        <use href="#fractal-arm" fill="url(#leaf-gradient)" transform="rotate(0)"/>
        <use href="#fractal-arm" fill="url(#leaf-gradient)" transform="rotate(45) scale(0.8)"/>
        <use href="#fractal-arm" fill="url(#leaf-gradient)" transform="rotate(-45) scale(0.8)"/>
        <use href="#fractal-arm" fill="url(#leaf-gradient)" transform="rotate(90) scale(0.6)"/>
        <use href="#fractal-arm" fill="url(#leaf-gradient)" transform="rotate(-90) scale(0.6)"/>
    </g>
  </g>
</svg>
