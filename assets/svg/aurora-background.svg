<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="aurora-gradient" cx="50%" cy="50%" r="75%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:rgba(138, 43, 226, 0.6);" />
      <stop offset="25%" style="stop-color:rgba(75, 0, 130, 0.5);" />
      <stop offset="50%" style="stop-color:rgba(0, 128, 128, 0.4);" />
      <stop offset="75%" style="stop-color:rgba(6, 7, 32, 0.7);" />
      <stop offset="100%" style="stop-color:rgba(5, 5, 20, 0.9);" />
    </radialGradient>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#aurora-gradient)"/>
  <rect width="1920" height="1080" fill="#060720" opacity="0.3"/>
  <rect width="1920" height="1080" filter="url(#noise)" opacity="0.03"/>
</svg>
