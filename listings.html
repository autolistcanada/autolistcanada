<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-lang-key="title_listings">Listings | AutoList Canada</title>
    <link rel="icon" href="/assets/images/icons/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body id="listings-page" class="flex bg-[#060720] text-gray-200 font-sans" x-data="{ view: 'grid' }">

    <!-- Dynamic Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main Content -->
    <main class="flex-1 p-4 sm:p-6 lg:p-8 pl-[276px]">
        <div class="max-w-7xl mx-auto">
            <!-- Header -->
            <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6">
                <div>
                    <h1 class="text-3xl font-bold text-accent-teal tracking-tight" data-lang-key="listings_header_title">Your Listings</h1>
                    <p class="mt-1 text-lg text-text-secondary" data-lang-key="listings_header_subtitle">Manage, optimize, and sync across all platforms.</p>
                </div>
                <div class="flex items-center space-x-2 mt-4 sm:mt-0">
                    <button class="btn-primary-glow">
                        <svg class="w-5 h-5 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
                        <span data-lang-key="listings_new_listing_btn">New Listing</span>
                    </button>
                </div>
            </header>

            <!-- Filters & View Toggle -->
            <div class="glass-card p-4 mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
                <!-- Filter Controls -->
                <div class="flex flex-wrap items-center gap-3">
                    <input type="search" id="listing-search" placeholder="Search by title, SKU..." data-lang-key="[placeholder]listings_search_placeholder" class="input-field-glass w-full sm:w-auto">
                    <select id="filter-status" class="input-field-glass">
                        <option value="all" data-lang-key="filter_status_all">All Statuses</option>
                        <option value="active" data-lang-key="filter_status_active">Active</option>
                        <option value="draft" data-lang-key="filter_status_draft">Draft</option>
                        <option value="sold" data-lang-key="filter_status_sold">Sold</option>
                    </select>
                    <select id="filter-platform" class="input-field-glass">
                        <option value="all" data-lang-key="filter_platform_all">All Platforms</option>
                        <!-- Options to be populated by JS -->
                    </select>
                </div>

                <!-- View Toggle -->
                <div class="flex items-center bg-gray-900/50 rounded-full p-1">
                    <button @click="view = 'grid'" :class="view === 'grid' ? 'btn-primary-glow' : 'btn-ghost'" class="p-2 rounded-full">
                        <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" /></svg>
                    </button>
                    <button @click="view = 'list'" :class="view === 'list' ? 'btn-primary-glow' : 'btn-ghost'" class="p-2 rounded-full">
                        <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" /></svg>
                    </button>
                </div>
            </div>

            <!-- Bulk Actions Bar (New: List Perfectly replication) -->
            <div id="bulk-actions-bar" class="glass-card p-4 mb-6 hidden flex flex-wrap items-center gap-3">
                <span class="text-sm font-medium text-accent-teal" id="bulk-count">0 selected</span>
                <button id="bulk-crosslist-btn" class="btn-primary-glow text-sm">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    Bulk Crosslist
                </button>
                <button id="bulk-delist-btn" class="btn-secondary-glow text-sm">
                    Delist
                </button>
                <button id="bulk-relist-btn" class="btn-secondary-glow text-sm">
                    Relist
                </button>
                <button id="bulk-mark-sold-btn" class="btn-secondary-glow text-sm">
                    Mark Sold
                </button>
                <button id="bulk-clear-btn" class="btn-ghost text-sm">Clear Selection</button>
                <!-- Integrate user idea: Psychology tone suggestion for bulk -->
                <div class="ml-auto flex items-center gap-2">
                    <span class="text-xs text-text-secondary">Suggested Tone:</span>
                    <span id="bulk-tone" class="text-xs font-medium text-accent-purple">Cozy</span>
                </div>
            </div>

            <!-- Listings Container -->
            <div id="listings-container">
                <!-- Grid View -->
                <div x-show="view === 'grid'" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                    <!-- JS will populate this -->
                </div>

                <!-- List View -->
                <div x-show="view === 'list'" class="glass-card overflow-hidden">
                    <div id="listings-list-container" class="divide-y divide-white/10">
                        <!-- JS will populate this -->
                    </div>
                </div>
            </div>

            <!-- Pagination -->
            <div id="pagination-controls" class="mt-8 flex justify-center items-center space-x-2">
                <!-- JS will populate this -->
            </div>
        </div>
    </main>

    <!-- AI Modal -->
    <div id="ai-tool-modal" class="fixed inset-0 bg-black/70 z-50 hidden items-center justify-center">
        <!-- Modal content will be loaded here by JS -->
    </div>

    <script src="./js/app.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/ai.js"></script>
    <script src="./js/listings.js"></script>
</body>
</html>
