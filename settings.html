<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="settings_title">Settings - AutoList Canada</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles/theme.css">
</head>
<body class="bg-background-dark font-sans text-text-primary">
  <div class="flex min-h-screen">
    <!-- Dynamic Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main Content -->
    <main class="flex-1 p-4 sm:p-6 lg:p-8 pl-[276px]">
      <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-accent-teal tracking-tight" data-i18n="settings_heading">Settings</h1>
            <button id="languageToggle" class="btn-ghost p-2 rounded-full flex items-center justify-center">
                <span id="languageDisplay" class="font-semibold text-accent-purple">EN</span>
            </button>
        </header>

        <!-- Settings Content -->
        <div class="space-y-8">
          <!-- Account Settings -->
          <div class="glass-card p-6">
            <h2 class="text-xl font-semibold mb-4 text-accent-green" data-i18n="account_settings">Account Settings</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label class="block text-sm font-medium text-text-secondary mb-2" data-i18n="email_label">Email Address</label>
                <input type="email" class="input-field-glass w-full" value="user@example.com">
              </div>
              <div>
                <label class="block text-sm font-medium text-text-secondary mb-2" data-i18n="name_label">Full Name</label>
                <input type="text" class="input-field-glass w-full" value="John Smith">
              </div>
              <div class="md:col-span-2">
                <label class="block text-sm font-medium text-text-secondary mb-2" data-i18n="password_label">Password</label>
                <button class="btn-secondary-glow" data-i18n="change_password">Change Password</button>
              </div>
            </div>
          </div>

          <!-- Marketplace Connections -->
          <div class="glass-card p-6">
            <h2 class="text-xl font-semibold mb-4 text-accent-orange" data-i18n="marketplace_connections">Marketplace Connections</h2>
            <div class="space-y-3">
              <div class="flex justify-between items-center p-3 rounded-lg bg-white/5">
                <span class="font-medium text-text-primary" data-i18n="ebay_ca">eBay Canada</span>
                <button id="ebay-connect" class="font-semibold text-accent-teal hover:text-accent-teal-dark transition-colors duration-200" data-i18n="connect">Connect</button>
              </div>
              <div class="flex justify-between items-center p-3 rounded-lg bg-white/5">
                <span class="font-medium text-text-primary" data-i18n="amazon_ca">Amazon Canada</span>
                <button id="amazon-connect" class="font-semibold text-accent-teal hover:text-accent-teal-dark transition-colors duration-200" data-i18n="connect">Connect</button>
              </div>
              <div class="flex justify-between items-center p-3 rounded-lg bg-white/5">
                <span class="font-medium text-text-primary" data-i18n="etsy">Etsy</span>
                <button id="etsy-connect" class="font-semibold text-accent-teal hover:text-accent-teal-dark transition-colors duration-200" data-i18n="connect">Connect</button>
              </div>
            </div>
            <div id="connected-status" class="mt-4 p-3 bg-accent-green/10 text-accent-green rounded-lg hidden">
              <p data-i18n="marketplace_connected_success">Marketplace successfully connected!</p>
            </div>
          </div>

          <!-- Preferences -->
          <div class="glass-card p-6">
            <h2 class="text-xl font-semibold mb-4 text-accent-purple" data-i18n="preferences">Preferences</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div class="md:col-span-2 flex items-center">
                <input type="checkbox" id="notificationsEnabled" class="form-checkbox-themed" checked>
                <label for="notificationsEnabled" class="ml-2 text-text-primary" data-i18n="enable_notifications">Enable Email Notifications</label>
              </div>
              <div>
                <label class="block text-sm font-medium text-text-secondary mb-2" data-i18n="default_language">Default Language</label>
                <select class="input-field-glass w-full">
                  <option value="en" data-i18n="english">English</option>
                  <option value="fr" data-i18n="french">French</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-medium text-text-secondary mb-2" data-i18n="time_zone">Time Zone</label>
                <select class="input-field-glass w-full">
                  <option value="America/Toronto">Eastern Time (ET)</option>
                  <option value="America/Edmonton">Mountain Time (MT)</option>
                  <option value="America/Vancouver">Pacific Time (PT)</option>
                </select>
              </div>
            </div>
          </div>
        
          <!-- Subscription -->
          <div class="glass-card p-6">
            <h2 class="text-xl font-semibold mb-4 text-accent-blue" data-i18n="subscription">Subscription</h2>
            <div class="p-4 bg-white/5 rounded-lg mb-4">
              <div class="flex justify-between items-center">
                <div>
                  <p class="text-sm text-text-secondary" data-i18n="current_plan">Current Plan:</p>
                  <p class="text-accent-blue text-lg font-bold">Professional</p>
                </div>
                <div class="text-right">
                  <p class="text-sm text-text-secondary" data-i18n="next_billing">Next Billing Date:</p>
                  <p class="text-text-primary">September 12, 2025</p>
                </div>
              </div>
            </div>
            <div class="flex space-x-4">
              <button class="btn-primary-glow" data-i18n="manage_plan">Manage Plan</button>
              <button class="btn-secondary-glow" data-i18n="billing_history">Billing History</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Include necessary scripts -->
  <script src="//unpkg.com/alpinejs" defer></script>
  <script src="js/sidebar.js"></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/services/marketplace-service.js" defer></script>
  <script src="js/services/ebay-service.js" defer></script>
  <script src="js/services/amazon-service.js" defer></script>
  <script src="js/services/etsy-service.js" defer></script>
  <script src="js/services/services-loader.js" defer></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Initialize language toggle
      const languageToggle = document.getElementById('languageToggle');
      const languageDisplay = document.getElementById('languageDisplay');
      
      // Check if we have a saved language preference
      const savedLanguage = localStorage.getItem('language') || 'en';
      languageDisplay.textContent = savedLanguage.toUpperCase();
      
      // Apply translations on page load
      changeLanguage(savedLanguage);
      
      // Add event listener for language toggle
      languageToggle.addEventListener('click', function() {
        const currentLang = localStorage.getItem('language') || 'en';
        const newLang = currentLang === 'en' ? 'fr' : 'en';
        
        // Update display
        languageDisplay.textContent = newLang.toUpperCase();
        
        // Change language
        changeLanguage(newLang);
      });
      
      // Initialize marketplace connections
      const ebayConnectBtn = document.getElementById('ebay-connect');
      const amazonConnectBtn = document.getElementById('amazon-connect');
      const etsyConnectBtn = document.getElementById('etsy-connect');
      const connectedStatus = document.getElementById('connected-status');
      
      // Check for connected marketplaces
      setTimeout(() => {
        if (window.AutoList && window.AutoList.servicesManager) {
          updateMarketplaceConnectionUI();
        }
      }, 1000);
      
      function updateMarketplaceConnectionUI() {
        try {
          const servicesManager = window.AutoList.servicesManager;
          const services = servicesManager.getAllServices();
          
          // Check eBay connection
          if (services['ebay-ca'] && services['ebay-ca'].isMarketplaceConnected('ebay-ca')) {
            ebayConnectBtn.textContent = document.documentElement.lang === 'fr' ? 'Déconnecter' : 'Disconnect';
            ebayConnectBtn.classList.remove('text-blue-500', 'hover:text-blue-700');
            ebayConnectBtn.classList.add('text-red-500', 'hover:text-red-700');
          }
          
          // Check Amazon connection
          if (services['amazon-ca'] && services['amazon-ca'].isMarketplaceConnected('amazon-ca')) {
            amazonConnectBtn.textContent = document.documentElement.lang === 'fr' ? 'Déconnecter' : 'Disconnect';
            amazonConnectBtn.classList.remove('text-blue-500', 'hover:text-blue-700');
            amazonConnectBtn.classList.add('text-red-500', 'hover:text-red-700');
          }
          
          // Check Etsy connection
          if (services['etsy'] && services['etsy'].isMarketplaceConnected('etsy')) {
            etsyConnectBtn.textContent = document.documentElement.lang === 'fr' ? 'Déconnecter' : 'Disconnect';
            etsyConnectBtn.classList.remove('text-blue-500', 'hover:text-blue-700');
            etsyConnectBtn.classList.add('text-red-500', 'hover:text-red-700');
          }
        } catch (error) {
          console.error('Error updating marketplace UI:', error);
        }
      }
      
      // Add event listeners for marketplace connections
      ebayConnectBtn.addEventListener('click', async function() {
        try {
          if (!window.AutoList || !window.AutoList.servicesManager) {
            console.error('Services manager not initialized');
            return;
          }
          
          const servicesManager = window.AutoList.servicesManager;
          const ebayService = servicesManager.getService('ebay-ca');
          
          if (!ebayService) {
            console.error('eBay service not found');
            return;
          }
          
          // Check if already connected
          if (ebayService.isMarketplaceConnected('ebay-ca')) {
            // Disconnect
            const result = ebayService.disconnectMarketplace('ebay-ca');
            if (result.success) {
              ebayConnectBtn.textContent = document.documentElement.lang === 'fr' ? 'Connecter' : 'Connect';
              ebayConnectBtn.classList.remove('text-red-500', 'hover:text-red-700');
              ebayConnectBtn.classList.add('text-blue-500', 'hover:text-blue-700');
            }
          } else {
            // Connect - simulate OAuth flow
            // In a real app, this would redirect to eBay auth page
            await ebayService.initialize({
              clientId: 'demo-client-id',
              clientSecret: 'demo-client-secret',
              redirectUri: 'https://www.autolistcanada.ca/callback'
            });
            
            const result = await ebayService.exchangeCodeForToken('simulated_auth_code');
            
            if (result.success) {
              // Show success message
              connectedStatus.classList.remove('hidden');
              setTimeout(() => connectedStatus.classList.add('hidden'), 3000);
              
              // Update UI
              ebayConnectBtn.textContent = document.documentElement.lang === 'fr' ? 'Déconnecter' : 'Disconnect';
              ebayConnectBtn.classList.remove('text-blue-500', 'hover:text-blue-700');
              ebayConnectBtn.classList.add('text-red-500', 'hover:text-red-700');
            }
          }
        } catch (error) {
          console.error('Error connecting to eBay:', error);
        }
      });
      
      // Similar handlers for Amazon and Etsy
      amazonConnectBtn.addEventListener('click', async function() {
        try {
          if (!window.AutoList || !window.AutoList.servicesManager) return;
          
          const servicesManager = window.AutoList.servicesManager;
          const amazonService = servicesManager.getService('amazon-ca');
          
          if (!amazonService) return;
          
          if (amazonService.isMarketplaceConnected('amazon-ca')) {
            // Disconnect
            const result = amazonService.disconnectMarketplace('amazon-ca');
            if (result.success) {
              amazonConnectBtn.textContent = document.documentElement.lang === 'fr' ? 'Connecter' : 'Connect';
              amazonConnectBtn.classList.remove('text-red-500', 'hover:text-red-700');
              amazonConnectBtn.classList.add('text-blue-500', 'hover:text-blue-700');
            }
          } else {
            // Connect - simulate connection
            const result = await amazonService.connect({
              sellerId: 'demo-seller-id',
              accessKey: 'demo-access-key',
              secretKey: 'demo-secret-key'
            });
            
            if (result.success) {
              connectedStatus.classList.remove('hidden');
              setTimeout(() => connectedStatus.classList.add('hidden'), 3000);
              
              amazonConnectBtn.textContent = document.documentElement.lang === 'fr' ? 'Déconnecter' : 'Disconnect';
              amazonConnectBtn.classList.remove('text-blue-500', 'hover:text-blue-700');
              amazonConnectBtn.classList.add('text-red-500', 'hover:text-red-700');
            }
          }
        } catch (error) {
          console.error('Error connecting to Amazon:', error);
        }
      });
      
      etsyConnectBtn.addEventListener('click', async function() {
        try {
          if (!window.AutoList || !window.AutoList.servicesManager) return;
          
          const servicesManager = window.AutoList.servicesManager;
          const etsyService = servicesManager.getService('etsy');
          
          if (!etsyService) return;
          
          if (etsyService.isMarketplaceConnected('etsy')) {
            // Disconnect
            const result = etsyService.disconnectMarketplace('etsy');
            if (result.success) {
              etsyConnectBtn.textContent = document.documentElement.lang === 'fr' ? 'Connecter' : 'Connect';
              etsyConnectBtn.classList.remove('text-red-500', 'hover:text-red-700');
              etsyConnectBtn.classList.add('text-blue-500', 'hover:text-blue-700');
            }
          } else {
            // Connect - simulate OAuth flow
            await etsyService.initialize({
              apiKey: 'demo-api-key',
              clientId: 'demo-client-id',
              clientSecret: 'demo-client-secret',
              redirectUri: 'https://www.autolistcanada.ca/callback'
            });
            
            const result = await etsyService.exchangeCodeForToken('simulated_auth_code');
            
            if (result.success) {
              connectedStatus.classList.remove('hidden');
              setTimeout(() => connectedStatus.classList.add('hidden'), 3000);
              
              etsyConnectBtn.textContent = document.documentElement.lang === 'fr' ? 'Déconnecter' : 'Disconnect';
              etsyConnectBtn.classList.remove('text-blue-500', 'hover:text-blue-700');
              etsyConnectBtn.classList.add('text-red-500', 'hover:text-red-700');
            }
          }
        } catch (error) {
          console.error('Error connecting to Etsy:', error);
        }
      });
    });
  </script>
</body>
</html>
